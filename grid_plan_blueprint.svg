<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" width="1400" height="980" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="minor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#3d6fb3" stroke-width="0.5" opacity="0.45"/>
    </pattern>
    <pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#minor)"/>
      <path d="M100 0H0V100" fill="none" stroke="#4a7fc4" stroke-width="1" opacity="0.5"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1d5aa6"/>
      <stop offset="100%" stop-color="#0f3a73"/>
    </radialGradient>
  </defs>

  <!-- Paper -->
  <rect width="1400" height="980" fill="url(#vignette)"/>
  <rect width="1400" height="980" fill="url(#major)"/>
  <rect x="20" y="20" width="1360" height="940" fill="none" stroke="#e8f1ff" stroke-width="3"/>
  <rect x="30" y="30" width="1340" height="920" fill="none" stroke="#e8f1ff" stroke-width="1"/>

  <g font-family="'Courier New', Courier, monospace" fill="#e8f1ff" stroke="#e8f1ff">

    <!-- Grid lines (dash-dot) -->
    <g stroke-width="1.2" stroke-dasharray="28 6 4 6" opacity="0.85" fill="none">
      <line x1="103" y1="170" x2="1300" y2="170"/>
      <line x1="103" y1="674" x2="1300" y2="674"/>
      <line x1="200" y1="90" x2="200" y2="802"/>
      <line x1="704" y1="90" x2="704" y2="802"/>
      <line x1="1208" y1="90" x2="1208" y2="802"/>
    </g>

    <!-- Grid bubbles -->
    <g stroke-width="2" fill="none">
      <circle cx="85" cy="170" r="18"/>
      <circle cx="85" cy="674" r="18"/>
      <circle cx="200" cy="820" r="18"/>
      <circle cx="704" cy="820" r="18"/>
      <circle cx="1208" cy="820" r="18"/>
    </g>
    <g font-size="20" font-weight="bold" text-anchor="middle" stroke="none">
      <text x="85" y="177">G</text>
      <text x="85" y="681">H</text>
      <text x="200" y="827">1</text>
      <text x="704" y="827">2</text>
      <text x="1208" y="827">3</text>
    </g>

    <!-- Columns -->
    <g stroke-width="2.5" fill="#e8f1ff" fill-opacity="0.12">
      <rect x="175" y="145" width="50" height="50"/>
      <rect x="679" y="145" width="50" height="50"/>
      <rect x="1183" y="145" width="50" height="50"/>
      <rect x="175" y="649" width="50" height="50"/>
      <rect x="679" y="649" width="50" height="50"/>
      <rect x="1183" y="649" width="50" height="50"/>
    </g>

    <!-- Opening 1920 x 1920 -->
    <rect x="414" y="255" width="192" height="192" fill="none" stroke-width="2.5"/>
    <g stroke-width="0.8" opacity="0.6">
      <line x1="414" y1="255" x2="606" y2="447"/>
      <line x1="606" y1="255" x2="414" y2="447"/>
    </g>
    <text x="510" y="245" font-size="12" text-anchor="middle" stroke="none" opacity="0.8">OPENING</text>

    <!-- Dimension lines -->
    <g stroke-width="1" fill="none">
      <!-- left: 5040 G-H -->
      <line x1="140" y1="170" x2="140" y2="674"/>
      <!-- opening vertical: 850 + 1920 -->
      <line x1="370" y1="170" x2="370" y2="447"/>
      <line x1="365" y1="255" x2="414" y2="255" opacity="0.7"/>
      <line x1="365" y1="447" x2="414" y2="447" opacity="0.7"/>
      <!-- opening horizontal: 1920 + 980 -->
      <line x1="414" y1="560" x2="704" y2="560"/>
      <line x1="414" y1="447" x2="414" y2="566" opacity="0.7"/>
      <line x1="606" y1="447" x2="606" y2="566" opacity="0.7"/>
      <!-- bottom: 5040 + 5040 -->
      <line x1="200" y1="745" x2="1208" y2="745"/>
    </g>

    <!-- Tick marks (architectural slashes) -->
    <g stroke-width="2.2">
      <line x1="134" y1="176" x2="146" y2="164"/>
      <line x1="134" y1="680" x2="146" y2="668"/>
      <line x1="364" y1="176" x2="376" y2="164"/>
      <line x1="364" y1="261" x2="376" y2="249"/>
      <line x1="364" y1="453" x2="376" y2="441"/>
      <line x1="408" y1="566" x2="420" y2="554"/>
      <line x1="600" y1="566" x2="612" y2="554"/>
      <line x1="698" y1="566" x2="710" y2="554"/>
      <line x1="194" y1="751" x2="206" y2="739"/>
      <line x1="698" y1="751" x2="710" y2="739"/>
      <line x1="1202" y1="751" x2="1214" y2="739"/>
    </g>

    <!-- Dimension text -->
    <g font-size="17" stroke="none" text-anchor="middle">
      <text transform="translate(130 422) rotate(-90)">5040</text>
      <text transform="translate(360 212) rotate(-90)">850</text>
      <text transform="translate(360 351) rotate(-90)">1920</text>
      <text x="510" y="552">1920</text>
      <text x="655" y="552">980</text>
      <text x="452" y="737">5040</text>
      <text x="956" y="737">5040</text>
    </g>

    <!-- Title block -->
    <g stroke-width="1.5" fill="none">
      <rect x="930" y="865" width="430" height="75"/>
      <line x1="930" y1="897" x2="1360" y2="897"/>
      <line x1="1150" y1="897" x2="1150" y2="940"/>
    </g>
    <g stroke="none">
      <text x="945" y="888" font-size="17" font-weight="bold">GRID PLAN – OPENING LOCATION</text>
      <text x="945" y="924" font-size="13">DIMENSIONS IN mm</text>
      <text x="1165" y="924" font-size="13">SCALE: N.T.S.</text>
    </g>
  </g>
</svg>
